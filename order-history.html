<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0C4326">
  <meta name="robots" content="noindex, nofollow">
  <title>Order History - Foresta Wood Industries</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles-luxury.css">
  <link rel="stylesheet" href="checkout.css">
  <link rel="stylesheet" href="auth-modal.css">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; margin: 0; }
    .oh-page { min-height: 100vh; background: #f8faf9; display: flex; flex-direction: column; }
    .oh-header {
      background: linear-gradient(135deg, #0c4326 0%, #1a5c3a 100%);
      padding: 1.25rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .oh-header-logo img { height: 60px; filter: brightness(0) invert(1); }
    .oh-header-back {
      display: inline-flex; align-items: center; gap: 0.5rem;
      color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: 500;
      padding: 0.5rem 1rem; border-radius: 8px;
      transition: background 0.2s;
    }
    .oh-header-back:hover { background: rgba(255,255,255,0.12); }

    .oh-container { max-width: 800px; margin: 0 auto; padding: 2rem 1.5rem 4rem; flex: 1; }

    .oh-title-row {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 1.75rem;
    }
    .oh-title-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, #0c4326, #1a5c3a);
      display: flex; align-items: center; justify-content: center;
      color: #fff; flex-shrink: 0;
    }
    .oh-title-row h1 {
      font-size: 1.5rem; font-weight: 700; color: #1a1a1a; margin: 0;
    }
    .oh-title-row p {
      font-size: 0.85rem; color: #666; margin: 0.15rem 0 0;
    }

    .oh-login-prompt {
      text-align: center; padding: 4rem 2rem;
      background: #fff; border-radius: 16px;
      border: 1px solid #e8ece9;
    }
    .oh-login-prompt svg { color: #0c4326; margin-bottom: 1rem; }
    .oh-login-prompt h3 { font-size: 1.15rem; color: #1a1a1a; margin: 0 0 0.5rem; }
    .oh-login-prompt p { color: #666; font-size: 0.9rem; margin: 0 0 1.5rem; }
    .oh-login-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 2rem; background: #0c4326; color: #fff;
      border: none; border-radius: 10px; font-size: 0.9rem;
      font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .oh-login-btn:hover { background: #1a5c3a; transform: translateY(-1px); }

    .oh-empty {
      text-align: center; padding: 4rem 2rem;
      background: #fff; border-radius: 16px;
      border: 1px solid #e8ece9;
    }
    .oh-empty svg { color: #999; margin-bottom: 1rem; }
    .oh-empty h3 { font-size: 1.1rem; color: #1a1a1a; margin: 0 0 0.5rem; }
    .oh-empty p { color: #666; font-size: 0.9rem; margin: 0 0 1.5rem; }
    .oh-browse-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 2rem; background: #0c4326; color: #fff;
      border: none; border-radius: 10px; font-size: 0.9rem;
      font-weight: 600; text-decoration: none; transition: all 0.2s;
    }
    .oh-browse-btn:hover { background: #1a5c3a; transform: translateY(-1px); }

    .oh-loading { text-align: center; padding: 3rem 1rem; color: #666; }
    .oh-loading-spinner {
      width: 36px; height: 36px; border: 3px solid #e8ece9;
      border-top-color: #0c4326; border-radius: 50%;
      animation: ohSpin 0.8s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes ohSpin { to { transform: rotate(360deg); } }

    .oh-list { display: flex; flex-direction: column; gap: 1rem; }

    .oh-card {
      background: #fff; border-radius: 16px;
      overflow: hidden; transition: all 0.25s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #e8ece9;
    }
    .oh-card:hover { border-color: #0c4326; box-shadow: 0 6px 24px rgba(12,67,38,0.1); }

    .oh-card-accent {
      height: 4px;
      background: linear-gradient(90deg, #0c4326, #2d8f5f, #0c4326);
    }
    .oh-card-inner { padding: 1.25rem 1.5rem; }

    .oh-card-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 1rem; gap: 0.5rem;
    }
    .oh-card-ref { font-weight: 700; font-size: 1.05rem; color: #0c4326; }
    .oh-card-date { font-size: 0.78rem; color: #999; margin-top: 0.15rem; }
    .oh-card-method {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; padding: 0.25rem 0.65rem; border-radius: 20px;
      background: linear-gradient(135deg, #eef5f0, #dceee3); color: #0c4326;
      white-space: nowrap;
    }

    .oh-card-items {
      margin: 0 0 1rem;
      background: #fafcfb; border-radius: 10px; padding: 0.5rem 0.75rem;
    }
    .oh-item-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.5rem 0.25rem; font-size: 0.85rem;
    }
    .oh-item-row + .oh-item-row { border-top: 1px solid #f0f2f1; }
    .oh-item-name { color: #333; flex: 1; font-weight: 500; }
    .oh-item-qty {
      color: #0c4326; font-weight: 600; margin-left: 1rem;
      white-space: nowrap; font-size: 0.8rem;
      background: #eef5f0; padding: 0.15rem 0.5rem; border-radius: 6px;
    }

    .oh-card-bottom {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 0.85rem; border-top: 1px solid #f0f0f0;
    }
    .oh-card-total { font-size: 0.85rem; color: #666; }
    .oh-card-total strong { color: #1a1a1a; font-size: 1rem; }

    .oh-reorder-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.6rem 1.5rem;
      background: linear-gradient(135deg, #0c4326, #1a5c3a); color: #fff;
      border: none; border-radius: 10px; font-size: 0.82rem;
      font-weight: 600; cursor: pointer; transition: all 0.25s;
      box-shadow: 0 2px 8px rgba(12,67,38,0.2);
    }
    .oh-reorder-btn:hover {
      background: linear-gradient(135deg, #1a5c3a, #2d8f5f);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(12,67,38,0.25);
    }

    .oh-footer {
      background: linear-gradient(135deg, #0c4326, #1a3c2a);
      color: #fff; text-align: center; padding: 1.5rem;
      font-size: 0.8rem;
    }
    .oh-footer a { color: #c9a962; text-decoration: none; }

    /* ── Mobile Responsive ── */
    @media (max-width: 600px) {
      .oh-header { padding: 1rem 1rem; }
      .oh-header-logo img { height: 42px; }
      .oh-header-back { font-size: 0.8rem; padding: 0.4rem 0.75rem; }

      .oh-container { padding: 1.25rem 0.85rem 3rem; }

      .oh-title-icon { width: 40px; height: 40px; border-radius: 12px; }
      .oh-title-icon svg { width: 20px; height: 20px; }
      .oh-title-row h1 { font-size: 1.25rem; }

      .oh-card-inner { padding: 1rem; }
      .oh-card-ref { font-size: 0.95rem; }

      .oh-card-top { flex-wrap: wrap; }

      .oh-card-items { padding: 0.4rem 0.6rem; }
      .oh-item-row { padding: 0.4rem 0.15rem; font-size: 0.82rem; }
      .oh-item-qty { font-size: 0.75rem; }

      .oh-card-bottom {
        flex-direction: column; gap: 0.85rem;
        align-items: stretch; text-align: center;
      }
      .oh-reorder-btn {
        width: 100%; justify-content: center;
        padding: 0.75rem 1rem; font-size: 0.85rem;
        border-radius: 12px;
      }

      .oh-login-prompt, .oh-empty { padding: 3rem 1.5rem; border-radius: 14px; }
      .oh-login-prompt h3, .oh-empty h3 { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <div class="oh-page">
    <!-- Header -->
    <header class="oh-header">
      <a href="index-luxury.html" class="oh-header-logo">
        <img src="assets/logo.png" alt="Foresta">
      </a>
      <a href="index-luxury.html" class="oh-header-back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Back to Home
      </a>
    </header>

    <!-- Content -->
    <div class="oh-container">
      <div class="oh-title-row">
        <div class="oh-title-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div>
          <h1>Order History</h1>
          <p id="ohSubtitle">Your previous orders</p>
        </div>
      </div>

      <div id="ohContent">
        <div class="oh-loading">
          <div class="oh-loading-spinner"></div>
          <p>Loading your orders...</p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="oh-footer">
      <p>&copy; 2026 Foresta Wood Industries. All rights reserved.</p>
      <p><a href="index-luxury.html#contact">Contact Us</a> &nbsp;&middot;&nbsp; <a href="tel:+971547862986">+971 54 786 2986</a> &nbsp;&middot;&nbsp; <a href="mailto:reachus@foresta.ae">reachus@foresta.ae</a></p>
    </footer>
  </div>

  <!-- Firebase -->
  <script type="module" src="firebase-init.js"></script>
  <!-- Auth Modal -->
  <script src="auth-modal.js"></script>
  <!-- Order History Logic -->
  <script src="order-history.js"></script>
</body>
</html>
