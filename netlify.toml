[build]
  publish = "."
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# EmailJS credentials — set these in Netlify Dashboard > Site Settings > Environment Variables
# EMAILJS_PUBLIC_KEY   = your public key
# EMAILJS_PRIVATE_KEY  = your private key (from EmailJS > Account > API Keys)
# EMAILJS_SERVICE_ID   = service_3p5b3uy
# EMAILJS_TEMPLATE_OWNER    = template_dwhammj
# EMAILJS_TEMPLATE_CUSTOMER = template_h9yk2mp

[[redirects]]
  from = "/pdf/:ref"
  to = "/.netlify/functions/pdf-view?ref=:ref"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.gstatic.com https://apis.google.com https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://api.emailjs.com https://www.google-analytics.com https://region1.google-analytics.com https://www.google.com https://static.cloudflareinsights.com; frame-src https://forestawebsite.firebaseapp.com https://accounts.google.com; object-src 'none'"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/**/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect root to the main page
[[redirects]]
  from = "/"
  to = "/index-luxury.html"
  status = 200
